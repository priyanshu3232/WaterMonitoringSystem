<style>

h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}h2:before{content:'';width:6px;height:22px;border-radius:3px;background:var(--saf);flex:none}.ok h2{justify-content:center}.ok h2:before{display:none}

.act{border-radius:18px}.act .ic{border-radius:16px;background:#fde6da;color:var(--saf)}.act.t2 .ic{background:#e3ebf9;color:var(--navy)}.act .go{width:36px;height:36px;border-radius:50%;background:#f1f4f9;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--navy)}
main.lm{max-width:1120px;padding-top:28px}
.lwrap{display:grid;grid-template-columns:1.15fr 1fr;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 14px 40px rgba(11,31,71,.16)}

.lcard{padding:34px 34px 26px}.lcard h2{font-size:26px;margin:0 0 2px}.lcard h2:before{display:none}
.roles button{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px}.roles svg{width:22px;height:22px}.roles button.on{box-shadow:0 0 0 3px #c9d8f5}
.lcard input,.lcard select{background:#f7f9fc}.lcard .btn.saf{margin-top:8px;background:linear-gradient(180deg,#ff7a33,#e2500f);border:0;box-shadow:0 8px 18px rgba(226,80,15,.35);font-size:19px;min-height:58px;border-radius:14px}

<script>
const DAY=864e5,KEY='jalnigrani-proto-v3';
const BLOCKS=[['ALA','Alauli','अलौली',25.655,86.41],['KHG','Khagaria','खगड़िया',25.505,86.47],['CHA','Chautham','चौथम',25.555,86.65],['MAN','Mansi','मानसी',25.51,86.555],['GOG','Gogri','गोगरी',25.42,86.635],['BEL','Beldaur','बेलदौर',25.6,86.74],['PAR','Parbatta','परबत्ता',25.335,86.71]].map((b,i)=>({id:b[0],en:b[1],hi:b[2],c:[b[3],b[4]],phone:'90000 0000'+(i+1)}));

function clampMap(){const m=ui.map;m.h=m.w*400/700;m.x=Math.max(0,Math.min(700-m.w,m.x));m.y=Math.max(0,Math.min(400-m.h,m.y))}
function applyMap(){const sv=document.getElementById('map');if(!sv)return;const m=ui.map||(ui.map={x:0,y:0,w:700,h:400}),k=m.w/700;sv.setAttribute('viewBox',m.x+' '+m.y+' '+m.w+' '+m.h);sv.querySelectorAll('circle').forEach(c=>{c.setAttribute('r',c.dataset.r*k);c.setAttribute('stroke-width',1.5*k)});sv.querySelectorAll('text.bl').forEach(t=>{t.setAttribute('font-size',13*k);t.style.display=k<.4?'none':''});sv.querySelectorAll('text.sl').forEach(t=>{t.style.display=k<.4?'':'none';t.setAttribute('font-size',10*k);t.setAttribute('dy',-10*k)})}
function zoomMap(f,cx,cy){const m=ui.map,nw=Math.min(700,Math.max(18,m.w*f)),r=nw/m.w;m.x=cx-(cx-m.x)*r;m.y=cy-(cy-m.y)*r;m.w=nw;clampMap();applyMap()}
const mapPt=e=>{const sv=document.getElementById('map'),b=sv.getBoundingClientRect(),m=ui.map;return [m.x+(e.clientX-b.left)/b.width*m.w,m.y+(e.clientY-b.top)/b.height*m.h,b]};

document.addEventListener('pointermove',e=>{const d=ui.drag;if(!d)return;const sv=document.getElementById('map');if(!sv)return;const b=sv.getBoundingClientRect(),dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.abs(dx)+Math.abs(dy)>5)d.moved=true;if(d.moved){ui.map.x=d.mx-dx/b.width*ui.map.w;ui.map.y=d.my-dy/b.height*ui.map.h;clampMap();applyMap()}});

 ${c&&m.result&&m.result!=='normal'?`<button class="btn" data-a="open" data-n="case" data-id="${c.id}">${L('Open the case','केस खोलें')} ${c.id}</button><br>`:''}<button class="btn o" data-a="open" data-n="source" data-id="${s.id}">${L('See history of this source','इस स्रोत का इतिहास देखें')}</button><br>${ui.role==='field'?`<button class="btn o" data-a="newsample">${L('Take another sample','एक और सैंपल लें')}</button><br>`:''}<button class="btn o" data-a="tab" data-v="home">${L('Go to home','होम पर जाएँ')}</button>`},
labentry(o){const m=smp(o.id),s=src(m.sourceId);return `<h2>${L('Enter lab result','लैब रिजल्ट भरें')}: ${m.id}</h2>${srcCard(s)}<div class="card"><p class="mut">${L('Collected on ','लिया गया: ')+fmt(m.date)} · ${uname(m.by)}${m.ref?' · '+L('Kit result of the same sample: ','उसी सैंपल का किट रिजल्ट: ')+P(RES[smp(m.ref).result]):''}</p>${m.photos&&m.photos.length?`<div class="ph">${thumbs(m.photos)}</div>`:''}${paramInputs()}<label>${L('Lab report number','लैब रिपोर्ट नंबर')}</label><input type="text" data-f="report" value="${esc(ui.form.report||'')}"><br><br><button class="btn saf" data-a="savelabres" data-id="${m.id}">${L('Save lab result','लैब रिजल्ट सेव करें')}</button></div>`},
source(o){const s=src(o.id),nd=nextDue(s),c=openCase(s.id),ev=[];
 samplesOf(s.id).forEach(m=>{ev.push({d:m.date,h:`${L('Sample','सैंपल')} <b>${m.id}</b> ${L('collected','लिया गया')} (${m.method==='kit'?L('field kit','फील्ड किट'):N(lab(m.labId))}) · ${uname(m.by)}${m.photos&&m.photos.length?`<div class="ph">${thumbs(m.photos)}</div>`:''}`});if(m.method==='lab'){ev.push({d:m.date,h:`${L('Sample','सैंपल')} ${m.id} ${L('sent to','भेजा गया:')} ${N(lab(m.labId))}`});if(m.received)ev.push({d:m.received,h:`${L('Sample','सैंपल')} ${m.id} ${L('received by the lab','लैब को मिल गया')}${m.receivedBy?' · '+uname(m.receivedBy):''}`});else ev.push({d:today(),h:`${L('Sample','सैंपल')} ${m.id}: ${chip(L('lab has not confirmed receipt yet','लैब ने अभी प्राप्ति की पुष्टि नहीं की'),'a')}`})}if(m.result){const k=m.ref&&smp(m.ref);ev.push({d:m.resultDate||m.date,h:`${L('Result of','रिजल्ट')} ${m.id}: ${rchip(m.result)} ${k&&k.result!==m.result?chip(L('Kit and lab differ','किट और लैब अलग'),'r'):''} <span class="mut">${PARAMS.filter(p=>m.vals[p.k]!=null).map(p=>N(p)+' '+(p.yn?(m.vals[p.k]==='present'?L('found','मिला'):L('not found','नहीं मिला')):m.vals[p.k])).join(', ')}${m.report?' · '+esc(m.report):''}</span>`})}});
 S.cases.filter(k=>k.sourceId===s.id).forEach(k=>k.log.forEach(g=>ev.push({d:g.d,h:`<b>${k.id}</b>: ${esc(L(g.en,g.hi))}`})));ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
 return `${srcCard(s)}<div class="card"><h3>${L('Next test','अगली जाँच')}</h3><p>${nd?chip(fmt(nd),nd<today()?'r':diff(nd,today())<=14?'a':'g')+' '+(c?L('(repeat test for open case)','(खुले केस की दोबारा जाँच)'):L('(routine test)','(नियमित जाँच)')):L('Not tested yet','अभी जाँच नहीं हुई')}</p>${c?`<br><button class="btn o" data-a="open" data-n="case" data-id="${c.id}">${L('Open case','केस खोलें')} ${c.id}</button>`:''}${ui.role==='field'?`<br><button class="btn saf" data-a="newsample" data-id="${s.id}">+ ${L('New sample of this source','इस स्रोत का नया सैंपल')}</button>`:''}</div>
 <div class="card"><h3>${L('Full history (newest first)','पूरा इतिहास (नया सबसे ऊपर)')}</h3><div class="tl">${ev.map(e=>`<div><span class="d">${fmt(e.d)}</span>${e.h}</div>`).join('')||L('No record yet.','अभी कोई रिकॉर्ड नहीं।')}</div></div>`},
case(o){const c=kase(o.id),s=src(c.sourceId),st=steps(c),R=ui.role,off=R==='officer'&&c.block===ui.block,fld=(R==='field'&&c.block===ui.block)||off,dn=st.filter(x=>x.done).length,nc=notConf(c);
 const head=(x,i)=>`<div class="h"><b><span class="num ${x.done?'dn':x.over?'ov':''}">${i+1}</span>${x.t}</b>${x.done?chip(L('Done ','हो गया ')+fmt(x.done),'g'):c.closed?chip('-','x'):x.over?chip(L('Late since ','देरी: ')+fmt(x.due),'r'):chip(L('Due ','नियत ')+fmt(x.due),'a')}</div>`;
 const A=c.alt||{},nb=nearby(s);const body={
 ack:c.ack?`<p class="mut">${officer(c.block)}</p>`:`<p class="mut">${L('Assigned to','जिम्मेदार')}: ${officer(c.block)} · ${blk(c.block).phone}</p>${off?`<br><button class="btn" data-a="ack" data-id="${c.id}">${L('I have seen this. I am taking charge.','मैंने देख लिया। जिम्मेदारी मेरी।')}</button>`:''}`,
 action:c.action?`<p>${esc(c.action.text)}</p>`:off?`<label>${L('What work is being done?','क्या काम हो रहा है?')}</label><input type="text" id="f_action" placeholder="${L('e.g. pipe repaired, chlorination, filter serviced','जैसे पाइप मरम्मत, क्लोरीन, फिल्टर सर्विस')}"><br><br><button class="btn" data-a="action" data-id="${c.id}">${L('Save','सेव करें')}</button>`:`<p class="mut">${L('Waiting for officer.','अधिकारी का इंतज़ार।')}</p>`,
 alt:(altOK(c)||!fld||c.closed)?(c.alt?`<div class="kv"><span>${L('Other source','दूसरा स्रोत')}</span><span>${esc(A.name)} ${A.dist?'· '+dist(+A.dist):''}</span><span>${L('Lab report','लैब रिपोर्ट')}</span><span>${A.tested?chip(L('Checked, safe','जाँची, सुरक्षित'),'g'):chip(L('Not checked','जाँच नहीं'),'r')} ${esc(A.report||'')}</span><span>${L('Working','चालू')}</span><span>${A.functional?chip(L('Yes','हाँ'),'g'):chip(L('No','नहीं'),'r')}</span><span>${L('People can reach','लोग जा सकते हैं')}</span><span>${A.accessible?chip(L('Yes','हाँ'),'g'):chip(L('No','नहीं'),'r')}</span></div>`:`<p>${chip(L('Not arranged yet','अभी तय नहीं'),'r')}</p>`):
  `<label>${L('Nearby sources with a Normal result','पास के स्रोत जिनका रिजल्ट सामान्य है')}</label>${nb.length?nb.map(n=>`<div class="nb"><div><b>${esc(n.x.id)}</b> · ${P(TYPES[n.x.type])} · <b>${dist(n.m)}</b><br><small>${esc(n.x.name)} · ${L('last test ','पिछली जाँच ')+fmt(n.l.resultDate||n.l.date)} (${n.l.id})</small></div><button class="btn s ${A.srcId===n.x.id?'gr':'o'}" data-a="pickalt" data-id="${c.id}" data-v="${n.x.id}">${A.srcId===n.x.id?L('Chosen','चुना गया'):L('Choose','चुनें')}</button></div>`).join(''):`<p class="mut">${s.lat?L('No tested safe source found nearby.','पास में कोई जाँचा हुआ सुरक्षित स्रोत नहीं मिला।'):L('This source has no GPS, so nearby sources cannot be listed.','इस स्रोत का GPS नहीं है, इसलिए पास के स्रोत नहीं दिख सकते।')}</p>`}
  <label>${L('Or write another source','या कोई और स्रोत लिखें')}</label><input type="text" id="f_altname" value="${esc(A.name||'')}" placeholder="${L('Source ID or description','स्रोत ID या विवरण')}">
  <div class="row"><div><label>${L('Distance (metres)','दूरी (मीटर)')}</label><input type="number" id="f_altdist" value="${esc(A.dist||'')}"></div><div><label>${L('Lab report or sample number','लैब रिपोर्ट या सैंपल नंबर')}</label><input type="text" id="f_altrep" value="${esc(A.report||'')}"></div></div>
  <label class="ck"><input type="checkbox" id="f_alttest" ${A.tested?'checked':''}>${L('Its lab report is checked. Water is safe to drink.','इसकी लैब रिपोर्ट देखी। पानी पीने लायक है।')}</label><label class="ck"><input type="checkbox" id="f_altfun" ${A.functional?'checked':''}>${L('It is working today. Water is coming.','आज चालू है। पानी आ रहा है।')}</label><label class="ck"><input type="checkbox" id="f_altacc" ${A.accessible?'checked':''}>${L('All affected people can reach and use it.','सभी प्रभावित लोग वहाँ जाकर पानी ले सकते हैं।')}</label>
  <p class="note">${L('This step is done only when all three boxes are ticked.','तीनों बॉक्स टिक होने पर ही यह चरण पूरा होगा।')}</p><br><button class="btn" data-a="alt" data-id="${c.id}">${L('Save check','जाँच सेव करें')}</button>`,
 comm:c.comm?`<p>${P(MODES[c.comm.mode])}</p>`:fld&&!c.closed?`<label>${L('How were people told?','लोगों को कैसे बताया?')}</label><select id="f_mode">${Object.keys(MODES).map(k=>`<option value="${k}">${P(MODES[k])}</option>`).join('')}</select><p class="note">${L('Share only the advice approved by PHED.','सिर्फ PHED से मंजूर सलाह ही बताएं।')}</p><br><button class="btn" data-a="comm" data-id="${c.id}">${L('Yes, people have been told','हाँ, लोगों को बता दिया')}</button>`:`<p>${chip(L('Not recorded','दर्ज नहीं'),'x')}</p>`,
 repeat:st[4].done?`<p>${L('Sample','सैंपल')} ${repeatOK(c).id} ${rchip('normal')}</p>`:c.closed?'':`<p class="mut">${L('A new sample of this source must come Normal.','इस स्रोत का नया सैंपल सामान्य आना चाहिए।')}</p>${off?`<div class="row" style="margin-top:8px"><input type="date" id="f_due" value="${c.repeatDue}"><button class="btn o s" data-a="setdue" data-id="${c.id}">${L('Change date','तारीख बदलें')}</button></div>`:''}${R==='field'&&fld?`<br><button class="btn" data-a="newsample" data-id="${s.id}">${L('Take repeat sample now','अभी दोबारा सैंपल लें')}</button>`:''}`,
 close:c.closed?(c.reason==='nc'?`<p class="mut">${L('Closed because the lab did not confirm the kit result.','लैब ने किट रिजल्ट की पुष्टि नहीं की, इसलिए बंद।')}</p>`:''):off?`<button class="btn gr" data-a="close" data-id="${c.id}" ${dn>=5?'':'disabled'}>${L('Close this case','यह केस बंद करें')}</button>${dn<5?`<p class="note">${L('All five steps above must be done first.','पहले ऊपर के पाँचों चरण पूरे होने चाहिए।')}</p>`:''}${nc?`<br><button class="btn o" data-a="closenc" data-id="${c.id}">${L('Close: lab did not confirm the kit result','बंद करें: लैब ने किट रिजल्ट की पुष्टि नहीं की')}</button>`:''}`:`<p class="mut">${L('Only the block officer can close a case.','केस सिर्फ प्रखंड अधिकारी बंद कर सकते हैं।')}</p>`};
 return `<h2>${c.id} ${chip(P(RES[c.severity]),RES[c.severity][2])} ${c.closed?chip(L('Closed','बंद'),'g'):overdue(c)?chip(L('Late','देरी'),'r'):chip(L('On time','समय पर'),'g')} ${nc&&!c.closed?chip(L('Lab did not confirm kit result','लैब ने किट रिजल्ट की पुष्टि नहीं की'),'b'):''}</h2>${srcCard(s)}
 <div class="card"><b>${dn}/6 ${L('steps done','चरण पूरे')}</b><div class="bar" style="margin-top:6px"><i style="width:${dn/6*100}%;background:var(--g)"></i></div><p class="note">${L('Opened on ','खुला: ')+fmt(c.opened)} · ${L('Sample','सैंपल')} ${c.sampleId} · <a href="#" data-a="open" data-n="source" data-id="${s.id}">${L('See full history of this source','इस स्रोत का पूरा इतिहास देखें')}</a></p><br><button class="btn o s" data-a="newticket" data-id="${s.id}" data-c="${c.id}">${L('Raise a ticket about this case','इस केस के बारे में टिकट दर्ज करें')}</button></div>
 ${st.map((x,i)=>`<div class="step">${head(x,i)}${body[x.k]}</div>`).join('')}`},
newticket(o){const f=ui.form,me=ui.user,def=f.to||(me.role==='field'?'je_'+blk(me.block).en.toLowerCase():me.role==='officer'?'dm_khagaria':'');const grp=(r)=>`<optgroup label="${P(ROLES[r])}">${USERS.filter(u=>u.role===r&&u.id!==me.id).map(u=>`<option value="${u.id}" ${def===u.id?'selected':''}>${uname(u.id)}</option>`).join('')}</optgroup>`;
 return `<h2>${L('Raise a ticket','टिकट दर्ज करें')}</h2><div class="card"><label>${L('What is the problem about?','समस्या किस बारे में है?')}</label><select data-f="cat">${Object.keys(TCAT).map(k=>`<option value="${k}" ${f.cat===k?'selected':''}>${P(TCAT[k])}</option>`).join('')}</select>
 <label>${L('Short title','छोटा शीर्षक')}</label><input type="text" data-f="title" value="${esc(f.title||'')}"><label>${L('Details','विवरण')}</label><textarea rows="3" data-f="desc">${esc(f.desc||'')}</textarea>
 <label>${L('Related source ID (optional)','संबंधित स्रोत ID (वैकल्पिक)')}</label><input type="text" data-f="sourceId" value="${esc(f.sourceId||'')}" placeholder="KHG-...">
 <label>${L('Assign to','किसे सौंपें')}</label><select data-f="to"><option value="">${L('Choose a person','व्यक्ति चुनें')}</option>${grp('officer')}${grp('field')}${grp('lab')}${grp('dm')}</select>${photoBox()}<br><button class="btn saf" data-a="saveticket">${L('Submit ticket','टिकट जमा करें')}</button></div>`},
ticket(o){const t=tkt(o.id),me=ui.user.id,mine=t.to===me,can=mine||ui.role==='dm';return `<h2>${t.id} ${chip(P(TST[t.status]),TST[t.status][2])}</h2><div class="card"><h3>${esc(t.title)}</h3><p>${esc(t.desc||'')}</p>${t.photos&&t.photos.length?`<div class="ph">${thumbs(t.photos)}</div>`:''}<br><div class="kv"><span>${L('Type','प्रकार')}</span><span>${P(TCAT[t.cat])}</span><span>${L('Raised by','दर्ज किया')}</span><span>${uname(t.by)} · ${fmt(t.created)}</span><span>${L('Assigned to','सौंपा गया')}</span><span>${uname(t.to)}</span>${t.sourceId&&src(t.sourceId)?`<span>${L('Source','स्रोत')}</span><span><a href="#" data-a="open" data-n="source" data-id="${esc(t.sourceId)}">${esc(t.sourceId)}</a></span>`:''}</div></div>
 <div class="card"><h3>${L('Updates','अपडेट')}</h3><div class="tl">${t.notes.map(n=>`<div><span class="d">${fmt(n.d)} · ${uname(n.by)}</span>${esc(n.text)}</div>`).join('')||`<span class="mut">${L('No updates yet.','अभी कोई अपडेट नहीं।')}</span>`}</div>
 <label>${L('Add an update','अपडेट जोड़ें')}</label><input type="text" id="f_note"><br><br><button class="btn o" data-a="tknote" data-id="${t.id}">${L('Add update','अपडेट जोड़ें')}</button></div>
 ${can&&t.status!=='done'?`<div class="card"><h3>${L('Action','कार्रवाई')}</h3>${t.status==='open'?`<button class="btn" data-a="tkst" data-id="${t.id}" data-v="prog">${L('Start work','काम शुरू करें')}</button><br>`:''}<button class="btn gr" data-a="tkst" data-id="${t.id}" data-v="done">${L('Mark as resolved','हल हो गया')}</button>
 <label>${L('Assign to another person','किसी और को सौंपें')}</label><div class="row"><select id="f_re">${USERS.filter(u=>u.id!==t.to).map(u=>`<option value="${u.id}">${uname(u.id)}</option>`).join('')}</select><button class="btn o s" data-a="tkre" data-id="${t.id}">${L('Reassign','सौंपें')}</button></div></div>`:''}`}};

/* ---------- actions ---------- */
const go=(n,id,x)=>{ui.form={};ui.flt={};if(ui.scr)ui.stack.push(ui.scr);ui.scr=Object.assign({n,id},x);render();scrollTo(0,0)};
const home=()=>{ui.scr=null;ui.stack=[];ui.form={};ui.flt={};ui.limit=30};
const val=id=>{const e=document.getElementById(id);return e?(e.type==='checkbox'?e.checked:e.value.trim()):''};
function autofill(){const f=ui.form,r=ui.lrole,b=blk(f.lblock||'ALA').en.toLowerCase();f.uid=r==='field'?'fs_'+b:r==='officer'?'je_'+b:r==='lab'?'lab_'+lab(f.llab||'LAB-01').u:'dm_khagaria';f.pw={field:'field@123',officer:'je@123',lab:'lab@123',dm:'dm@123'}[r]}
const A={
recv(d){const m=smp(d.id);m.received=today();m.receivedBy=ui.user.id;save();toast(L('Receipt recorded for ','प्राप्ति दर्ज: ')+m.id);render()},
goto(d){ui.tab=d.t;home();ui.flt={st:d.st||''};render();scrollTo(0,0)},
mz(d){const m=ui.map;if(+d.v===0){ui.map={x:0,y:0,w:700,h:400};applyMap()}else zoomMap(+d.v,m.x+m.w/2,m.y+m.h/2)},
lang(){ui.lang=ui.lang==='en'?'hi':'en';render()},zoom(d){ui.zoom=+d.v;render()},
lrole(d){ui.lrole=d.v;ui.lerr='';autofill();render()},
demo(){autofill();ui.lerr='';render()},
dologin(){const f=ui.form,r=ui.lrole,u=USERS.find(x=>x.id===(f.uid||'').trim().toLowerCase());if(!u||u.pw!==f.pw||u.role!==r){ui.lerr=L('Wrong user ID or password for this role.','इस भूमिका के लिए यूज़र आईडी या पासवर्ड गलत है।');return render()}
 if((r==='field'||r==='officer')&&u.block!==(f.lblock||'ALA')){ui.lerr=L('This user ID does not belong to the block you chose.','यह यूज़र आईडी चुने गए प्रखंड की नहीं है।');return render()}if(r==='lab'&&u.lab!==(f.llab||'LAB-01')){ui.lerr=L('This user ID does not belong to the lab you chose.','यह यूज़र आईडी चुनी गई लैब की नहीं है।');return render()}
 ui.user=u;ui.role=u.role;ui.block=u.block||'';ui.lab=u.lab||'';ui.lerr='';ui.tab='home';home();render()},
logout(){ui.user=null;ui.role=null;home();autofill();render()},
reset(){seed();toast(L('Sample data loaded again','नमूना डेटा दोबारा लोड हुआ'));render()},
tab(d){ui.tab=d.v;home();render();scrollTo(0,0)},more(){ui.limit+=30;render()},
latecases(){ui.tab='cases';home();ui.flt={st:'late'};render();scrollTo(0,0)},blockcases(d){ui.tab='cases';home();ui.flt={block:d.v};render();scrollTo(0,0)},
back(){ui.scr=ui.stack.pop()||null;ui.form={};ui.flt={};render()},
open(d){go(d.n,d.id)},
newsample(d){if(d.id)go('method',d.id);else go('pick')},
picksrc(d){go('method',d.id)},
savesrc(){const f=ui.form;if(!f.name){toast(L('Please write the village and ward','कृपया गाँव और वार्ड लिखें'));return}const n=Math.max(0,...S.sources.filter(s=>s.block===ui.block).map(s=>+s.id.slice(-3)))+1;const s={id:'KHG-'+ui.block+'-'+String(n).padStart(3,'0'),block:ui.block,name:f.name,type:f.type||'hp',hh:+f.hh||0,lat:f.lat?+f.lat:'',lng:f.lng?+f.lng:'',photos:f.photos||[]};S.sources.push(s);save();toast(L('Source saved: ','स्रोत सेव हुआ: ')+s.id);ui.scr=null;go('method',s.id)},
setres(d){ui.form.result=d.v;updSug()},
savekit(d){const v=vals(),r=curRes(),f=ui.form;if(!r){toast(L('Fill at least one value or choose a result','कम से कम एक मान भरें या रिजल्ट चुनें'));return}const m=newSample({sourceId:d.id,method:'kit',by:ui.user.id,vals:v,result:r,photos:f.photos||[]});if(f.also)newSample({sourceId:d.id,method:'lab',labId:f.labId||LABOF[ui.block],by:ui.user.id,vals:{},ref:m.id});save();const also=!!f.also;ui.stack=[];ui.scr=null;go('saved',m.id,{also})},
savelab(d){const f=ui.form,m=newSample({sourceId:d.id,method:'lab',labId:f.labId||LABOF[ui.block],by:ui.user.id,vals:{},photos:f.photos||[]});save();ui.stack=[];ui.scr=null;go('saved',m.id)},
savelabres(d){const m=smp(d.id),r=curRes();if(!r){toast(L('Fill at least one value or choose a result','कम से कम एक मान भरें या रिजल्ट चुनें'));return}m.vals=vals();m.result=r;m.resultDate=today();m.labBy=ui.user.id;m.report=ui.form.report||'';afterResult(m);save();ui.stack=[];ui.scr=null;go('saved',m.id)},
ack(d){const c=kase(d.id);c.ack=today();log(c,'Officer took charge','अधिकारी ने जिम्मेदारी ली');save();toast(L('Saved','सेव हुआ'));render()},
action(d){const t=val('f_action');if(!t){toast(L('Please write what work is being done','कृपया लिखें क्या काम हो रहा है'));return}const c=kase(d.id);c.action={text:t,date:today()};log(c,'Work started: '+t,'काम शुरू: '+t);save();toast(L('Saved','सेव हुआ'));render()},
pickalt(d){const c=kase(d.id),s=src(c.sourceId),x=src(d.v),l=lastDone(x.id);c.alt={srcId:x.id,name:x.id+' ('+TYPES[x.type][0]+', '+x.name+')',dist:hav(s,x),report:l.id,tested:diff(today(),l.resultDate||l.date)<=180,functional:false,accessible:false,date:null};save();toast(L('Chosen. Now visit it and tick the boxes below.','चुना गया। अब वहाँ जाकर नीचे के बॉक्स टिक करें।'));render()},
alt(d){const c=kase(d.id),n=val('f_altname');if(!n){toast(L('Please choose or write the other source','कृपया दूसरा स्रोत चुनें या लिखें'));return}c.alt={srcId:c.alt&&c.alt.name===n?c.alt.srcId:'',name:n,dist:val('f_altdist'),report:val('f_altrep'),tested:val('f_alttest'),functional:val('f_altfun'),accessible:val('f_altacc'),date:null};if(altOK(c)){c.alt.date=today();log(c,'Other safe water checked: '+n,'दूसरा सुरक्षित पानी जाँचा गया: '+n);toast(L('Other safe water is verified','दूसरा सुरक्षित पानी पक्का हुआ'))}else toast(L('Saved. Step is not complete until all three are ticked.','सेव हुआ। तीनों टिक होने तक चरण अधूरा है।'));save();render()},
comm(d){const c=kase(d.id),m=val('f_mode');c.comm={date:today(),mode:m};log(c,'People informed ('+MODES[m][0].toLowerCase()+')','लोगों को बताया गया ('+MODES[m][1]+')');save();toast(L('Saved','सेव हुआ'));render()},
setdue(d){const c=kase(d.id),v=val('f_due');if(v){c.repeatDue=v;log(c,'Repeat test date set to '+fmt(v),'दोबारा जाँच की तारीख: '+fmt(v));save();toast(L('Date changed','तारीख बदली'));render()}},
close(d){const c=kase(d.id);c.closed=today();log(c,'Case closed by officer after normal repeat test','दोबारा जाँच सामान्य आने पर अधिकारी ने केस बंद किया');save();toast(L('Case closed','केस बंद हुआ'));render()},
closenc(d){const c=kase(d.id);c.closed=today();c.reason='nc';log(c,'Case closed by officer: lab did not confirm the kit result','अधिकारी ने केस बंद किया: लैब ने किट रिजल्ट की पुष्टि नहीं की');save();toast(L('Case closed','केस बंद हुआ'));render()},
newticket(d){go('newticket');if(d.id){ui.form.sourceId=d.id;ui.form.title=d.c?L('About ','के बारे में: ')+d.c:'';render()}},
saveticket(){const f=ui.form;if(!f.title||!f.to){toast(L('Please write a title and choose a person','कृपया शीर्षक लिखें और व्यक्ति चुनें'));return}const t=newTicket({by:ui.user.id,to:f.to,cat:f.cat||'kit',title:f.title,desc:f.desc||'',sourceId:(f.sourceId||'').trim(),photos:f.photos||[]});save();toast(L('Ticket submitted: ','टिकट जमा हुआ: ')+t.id+L('. Assigned to ','। सौंपा गया: ')+uname(t.to));ui.tab='tickets';home();go('ticket',t.id)},
tknote(d){const v=val('f_note');if(!v)return;tkt(d.id).notes.push({by:ui.user.id,d:today(),text:v});save();render()},
tkst(d){const t=tkt(d.id);t.status=d.v;t.notes.push({by:ui.user.id,d:today(),text:d.v==='done'?'Marked as resolved':'Work started'});save();toast(L('Saved','सेव हुआ'));render()},
tkre(d){const t=tkt(d.id),v=val('f_re');t.to=v;t.notes.push({by:ui.user.id,d:today(),text:'Reassigned to '+uname(v)});save();toast(L('Reassigned','सौंप दिया'));render()}};
document.addEventListener('click',e=>{if(e.target.closest('a.call')||e.target.closest('label.up'))return;const el=e.target.closest('[data-a]');if(!el)return;if(ui.dragMoved&&el.closest('#map'))return;if(el.tagName==='A')e.preventDefault();A[el.dataset.a](el.dataset)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.f;if(t.dataset.flt){ui.flt[t.dataset.flt]=t.value;ui.limit=30;render();if(t.dataset.flt==='q'){const q=document.getElementById('flt_q');q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}if(!k)return;ui.form[k]=t.type==='checkbox'?t.checked:t.value;if(k==='lblock'||k==='llab'){autofill();render();return}if(k==='also')render();else if(k.startsWith('p_'))updSug()});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset.photo)return;ui.form.photos=ui.form.photos||[];[...t.files].slice(0,4).forEach(file=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ui.form.photos.push(cv.toDataURL('image/jpeg',.6));const th=document.getElementById('thumbs');if(th)th.innerHTML=thumbs(ui.form.photos)};im.src=rd.result};rd.readAsDataURL(file)})});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!ui.user&&e.target.dataset.f)A.dologin()});
S=load();if(!S)seed();autofill();render();
</script>
</body>
</html>
